<!doctype html>
<html lang="vi"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Play around — Way</title>
<meta name="description" content="Ý tưởng và những shot nghịch của Way.">
<style>
@font-face{font-family:"Switzer";font-weight:500;font-display:swap;src:url(assets/fonts/Switzer-Medium.woff2) format("woff2")}
@font-face{font-family:"Switzer";font-weight:400;font-display:swap;src:url(assets/fonts/Switzer-Regular.woff2) format("woff2")}
:root{--bg:#101010;--fg:#fffaee;--mut:rgba(255,250,238,.45)}
*{box-sizing:border-box;margin:0}
html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--fg);font:500 15px/1.3 "Switzer",system-ui,sans-serif;overscroll-behavior:none}
#stage{position:fixed;inset:0;perspective:1100px;perspective-origin:50% 50%;touch-action:none;cursor:grab;overflow:hidden}
#stage.drag{cursor:grabbing}
.it{position:absolute;left:0;top:0;will-change:transform,opacity;backface-visibility:hidden;cursor:pointer}
.it img{display:block;width:100%;height:100%;object-fit:cover;pointer-events:none;user-select:none;-webkit-user-drag:none;background:#222}
.bar{position:fixed;left:0;right:0;display:flex;justify-content:space-between;align-items:center;padding:20px 24px;z-index:5;pointer-events:none}
.bar a,.bar button{pointer-events:auto;color:var(--fg);text-decoration:none;background:none;border:0;font:inherit;cursor:pointer;opacity:.6;transition:opacity .2s}
.bar a:hover,.bar button:hover{opacity:1}
.top{top:0}.bot{bottom:0;padding-bottom:calc(20px + env(safe-area-inset-bottom,0px))}
.hint{color:var(--mut);pointer-events:none}
.zoom{display:flex;gap:18px}
#lb{position:fixed;inset:0;z-index:20;background:rgba(16,16,16,0);display:none;cursor:zoom-out;transition:background .5s}
#lb.on{display:block}#lb.in{background:rgba(16,16,16,.88)}
#lbImg{position:absolute;left:0;top:0;transform-origin:0 0;transition:transform .6s cubic-bezier(.16,.84,.3,1);object-fit:cover}
#lbCap{position:absolute;left:0;right:0;bottom:6vh;text-align:center;opacity:0;transition:opacity .4s;padding:0 24px}
#lbCap b{display:block;font-weight:500}#lbCap span{color:var(--mut)}
#lb.in #lbCap{opacity:1;transition-delay:.3s}
@media (prefers-reduced-motion:reduce){#lbImg{transition-duration:.01s}}
</style></head><body>
<div class="bar top"><a href="index.html">← Way</a><span class="hint">Play around</span></div>
<div id="stage"></div>
<div class="bar bot"><span class="hint">Kéo để xoay · Ctrl/pinch để zoom · Bấm vào shot để xem</span>
  <div class="zoom"><button id="zo" aria-label="Zoom out">−</button><button id="zi" aria-label="Zoom in">+</button></div></div>
<div id="lb"><img id="lbImg" alt=""><div id="lbCap"><b></b><span></span></div></div>
<script src="data/play.js"></script>
<script src="assets/js/play.js"></script>
</body></html>
