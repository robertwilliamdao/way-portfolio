<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Builder — Collected Works</title>
<link rel="icon" type="image/png" href="../favicon-32.png">
<style>
@font-face{font-family:"Switzer";font-weight:500;src:url(../assets/fonts/Switzer-Medium.woff2) format("woff2")}
@font-face{font-family:"Switzer";font-weight:400;src:url(../assets/fonts/Switzer-Regular.woff2) format("woff2")}
:root{--bg:#101010;--fg:#fffaee;--mut:rgba(255,250,238,.45);--line:rgba(255,250,238,.14);--card:#171717;--acc:#fffaee;color-scheme:dark}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--fg);font:500 14px/1.35 "Switzer",system-ui,sans-serif;letter-spacing:-.01em}
button,input,textarea,select{font:inherit;color:inherit;letter-spacing:inherit}
button{background:none;border:.5px solid var(--line);border-radius:100px;padding:6px 12px;cursor:pointer;white-space:nowrap}
button:hover{border-color:var(--fg)}
button.pri{background:var(--fg);color:var(--bg);border-color:var(--fg)}
button.ghost{border-color:transparent;color:var(--mut)} button.ghost:hover{color:var(--fg)}
button:disabled{opacity:.4;cursor:default}
input,textarea,select{width:100%;background:transparent;border:.5px solid var(--line);padding:8px 10px;outline:none}
input:focus,textarea:focus,select:focus{border-color:var(--fg)}
textarea{resize:vertical;min-height:70px}
label{display:flex;flex-direction:column;gap:4px;color:var(--mut);font-size:12px}
label > *{color:var(--fg);font-size:14px}
.row{display:flex;gap:10px;align-items:flex-end}
.row > *{flex:1;min-width:0}
.row > .shrink{flex:none}
header{position:sticky;top:0;z-index:5;display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 20px;background:var(--bg);border-bottom:.5px solid var(--line)}
header h1{font-size:18px;font-weight:500}
header .st{color:var(--mut);font-size:12px}
.wrap{display:grid;grid-template-columns:280px 1fr;min-height:calc(100vh - 57px)}
aside{border-right:.5px solid var(--line);padding:16px;display:flex;flex-direction:column;gap:8px}
.wi{display:flex;align-items:center;gap:10px;padding:8px;border:.5px solid transparent;cursor:pointer;user-select:none}
.wi:hover{border-color:var(--line)} .wi.on{border-color:var(--fg)}
.wi img{width:56px;aspect-ratio:16/9;object-fit:cover;background:#222;flex:none}
.wi .t{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.wi .h{color:var(--mut);cursor:grab;padding:0 4px}
.wi.drag{opacity:.4}
main{padding:20px 28px 120px;display:flex;flex-direction:column;gap:28px;max-width:980px}
section{display:flex;flex-direction:column;gap:12px}
section > h2{font-size:22px;font-weight:500;display:flex;justify-content:space-between;align-items:center}
section > h2 button{font-size:14px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.box{border:.5px solid var(--line);padding:14px;display:flex;flex-direction:column;gap:12px;background:var(--card)}
.box .bh{display:flex;justify-content:space-between;align-items:center;gap:8px}
.box .bh b{font-weight:500}
.tag{font-size:11px;color:var(--mut);border:.5px solid var(--line);border-radius:100px;padding:2px 8px}
.slot{display:flex;gap:10px;align-items:center}
.thumb{width:120px;aspect-ratio:16/9;background:#222 center/cover no-repeat;flex:none;position:relative;overflow:hidden}
.thumb video,.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.thumb.big{width:260px;aspect-ratio:auto;min-height:90px;background:#222}
.thumb.big img,.thumb.big video{height:auto;object-fit:contain}
.slot.stack{flex-direction:column;align-items:stretch}
.slot.stack .thumb.big{width:100%}
.cols{display:grid;gap:12px}
.lgrid{display:grid;gap:12px;grid-template-columns:repeat(2,minmax(0,1fr));align-items:start}
.lg-full{grid-template-columns:1fr}
.lg-three-46{grid-template-columns:repeat(3,minmax(0,1fr))}
.lg-half-45-169.swapped .lc0,.lg-bento.swapped .lc0{order:2}
.lg-bento .lc0{grid-column:1;grid-row:1 / span 2}
.lg-bento .lc1{grid-column:2;grid-row:1} .lg-bento .lc2{grid-column:2;grid-row:2}
.lg-bento.swapped .lc0{grid-column:2} .lg-bento.swapped .lc1,.lg-bento.swapped .lc2{grid-column:1}
.lcell{display:flex;flex-direction:column;gap:6px}
.spec{font-size:11px;color:var(--mut)}
.meta{font-size:12px;color:var(--mut)} .meta.warn{color:#ffb86b}
.sw{flex-direction:row;align-items:center;gap:6px;color:var(--fg);font-size:13px;cursor:pointer}
.sw input{width:auto}
.thumb.big img,.thumb.big video{height:100%;object-fit:cover}
.lpick{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px}
.lpick button{border-radius:0;display:flex;flex-direction:column;gap:8px;align-items:stretch;padding:10px;white-space:normal;text-align:left}
.mini{display:grid;gap:3px;height:54px}
.mini i{background:var(--mut);opacity:.5;display:block}
@media (max-width:800px){.lpick{grid-template-columns:repeat(2,1fr)}.lgrid,.lg-three-46{grid-template-columns:1fr}.lg-bento .lc0,.lg-bento .lc1,.lg-bento .lc2{grid-column:auto;grid-row:auto}}
.slot .info{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px}
.slot .path{color:var(--mut);font-size:12px;word-break:break-all}
.items{display:flex;flex-direction:column;gap:10px}
.it{border-top:.5px dashed var(--line);padding-top:10px;display:flex;flex-direction:column;gap:8px}
.mut{color:var(--mut);font-size:12px}
.login{max-width:420px;margin:12vh auto;display:flex;flex-direction:column;gap:14px;padding:20px}
.login h1{font-size:32px;font-weight:500;line-height:1}
.qback{position:fixed;inset:0;background:rgba(0,0,0,.7);display:flex;align-items:center;justify-content:center;z-index:50;padding:16px}
.qbox{background:var(--card);border:.5px solid var(--line);padding:16px;display:flex;flex-direction:column;gap:12px;width:min(520px,100%);max-height:94vh;overflow:auto}
.qprev{background:#111;display:flex;justify-content:center}.qprev img{max-width:100%;max-height:40vh;display:block}
.qbox label{display:flex;flex-direction:column;gap:6px}.qsize{font-size:14px}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:100px;opacity:0;transition:opacity .3s;pointer-events:none;max-width:90vw;text-align:center}
.toast.on{opacity:1}
.empty{color:var(--mut);padding:40px 0}
@media (max-width:800px){.wrap{grid-template-columns:1fr}aside{border-right:0;border-bottom:.5px solid var(--line)}.grid2{grid-template-columns:1fr}main{padding:16px}}
.tabs{display:flex;gap:6px;margin-right:auto;margin-left:12px}
button.tab.on{background:var(--fg);color:var(--bg);border-color:var(--fg)}
</style>
</head>
<body>
<div id="app"></div>
<div class="toast" id="toast"></div>
<script>
(function(){
/* ======== Settings ======== */
var REPO={owner:"robertwilliamdao",repo:"way-portfolio",branch:"main"};
var DATA_PATH="data/works.js", MEDIA_DIR="assets/works/", PLAY_PATH="data/play.js", PLAY_DIR="assets/play/";
var MAX_IMG=1920, IMG_Q=.82, MAX_FILE=25*1024*1024;
var SUGGEST_Q=.78, SUGGEST_Q_HEAVY=.7, HEAVY_BYTES=400*1024;   /* default for new uploads; lower if the 1920px file is still > 400KB (grainy images) */
var API="https://api.github.com/repos/"+REPO.owner+"/"+REPO.repo;

/* ======== State ======== */
var token=localStorage.getItem("way-gh-token")||"";
var works=[], sel=0, play=[], psel=0, playOk=true, mode="works", dirty=false, pending={};   /* play = Playground shots; playOk=false if data/play.js could not be read (then it is never overwritten) */   /* pending: path -> {blob, url, kind} */
var app=document.getElementById("app");

/* ======== Helpers ======== */
function h(tag,attrs,kids){ var el=document.createElement(tag); attrs=attrs||{};
  for(var k in attrs){ var v=attrs[k]; if(k==="on") for(var e in v) el.addEventListener(e,v[e]); else if(k==="html") el.innerHTML=v; else if(v!==false&&v!=null) el.setAttribute(k,v===true?"":v); }
  (kids||[]).forEach(function(c){ if(c!=null) el.appendChild(typeof c==="string"?document.createTextNode(c):c); }); return el; }
function toast(msg,ms){ var t=document.getElementById("toast"); t.textContent=msg; t.classList.add("on"); clearTimeout(t._t); t._t=setTimeout(function(){ t.classList.remove("on"); },ms||2600); }
function slug(s){ return (s||"work").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/đ/g,"d").replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"")||"work"; }
function isVideo(p){ return /\.(mp4|webm|mov|m4v)(\?|$)/i.test(p||""); }
function src(p){ if(!p) return ""; if(pending[p]) return pending[p].url; if(/^https?:|^blob:|^data:/.test(p)) return p; return "../"+p; }
function mark(){ dirty=true; renderHeader(); }
function b64ToText(b){ return decodeURIComponent(escape(atob(b.replace(/\n/g,"")))); }
function textToB64(t){ return btoa(unescape(encodeURIComponent(t))); }
function blobToB64(blob){ return new Promise(function(res,rej){ var r=new FileReader(); r.onload=function(){ res(String(r.result).split(",")[1]); }; r.onerror=rej; r.readAsDataURL(blob); }); }

/* ======== GitHub ======== */
function gh(path,opt){ opt=opt||{};
  return fetch(API+path,{method:opt.method||"GET",headers:{"Authorization":"Bearer "+token,"Accept":"application/vnd.github+json","X-GitHub-Api-Version":"2022-11-28"},body:opt.body?JSON.stringify(opt.body):undefined})
    .then(function(r){ if(r.status===401) throw new Error("Mã truy cập sai hoặc đã hết hạn."); if(r.status===403||r.status===404) throw new Error("Mã không có quyền ghi vào repo way-portfolio."); if(!r.ok) throw new Error("GitHub báo lỗi "+r.status); return r.json(); }); }
function load(){
  return Promise.all([gh("/contents/"+DATA_PATH+"?ref="+REPO.branch),gh("/contents/"+PLAY_PATH+"?ref="+REPO.branch).catch(function(){ return null; })]).then(function(r){
    var txt=b64ToText(r[0].content), i=txt.indexOf("["), j=txt.lastIndexOf("]");
    works=JSON.parse(txt.slice(i,j+1)).map(migrate); sel=0; dirty=false; pending={};
    play=[]; psel=0; playOk=true;
    if(r[1]){ try{ var t=b64ToText(r[1].content), k=t.indexOf("window.PLAY"), a=t.indexOf("[",k), z=t.lastIndexOf("]"); play=JSON.parse(t.slice(a,z+1)); }catch(e){ play=[]; playOk=false; } }
  });
}
/* Older data used frames/mockups; keep only the image or video each block shows */
function pickSrc(f){ if(!f) return ""; return f.src||f.bg||((f.items||[])[0]||{}).src||""; }
function migrate(w){
  w.blocks=(w.blocks||[]).map(function(b){
    if(b.type==="text") return b;
    if(b.type==="layout") return b;
    if(b.type==="row"){ var its=(b.items&&typeof b.items[0]==="string")?b.items:(b.cells||[]).map(pickSrc);
      return its.length>=3?{type:"layout",layout:"three-46",items:its.slice(0,3)}:{type:"layout",layout:"half-45",items:[its[0]||"",its[1]||""]}; }
    return {type:"layout",layout:"full",items:[pickSrc(b)]};
  }).filter(function(b){ return b.type==="text"||(b.items&&b.items.some(Boolean)); });
  return w;
}
function serialize(){ return "/* Edited by the builder (admin/). Every work: card info, detail info, and a list of layout blocks. */\nwindow.WORKS = "+JSON.stringify(works,function(k,v){ return k==="_idTouched"?undefined:v; },2)+";\n"; }
var PLAY_HEAD="/* Playground shots. Edited by the builder (admin/, tab Playground) or by hand.\n   title = headline, note = body: shown at the bottom of the Playground while the pointer is on a shot, and under the image when it is opened.\n   src = image ending in -r.webp (the site uses the -r-640 and -r-1280 copies the builder makes).\n   ar / pos are optional and force a crop (aspect ratio, focus point 0..1). Without them a shot keeps its own aspect ratio. */\nwindow.PLAY = ";
function serializePlay(){ return PLAY_HEAD+JSON.stringify(play.filter(function(s){ return s.src; }),null,2)+";\n"; }   /* a shot without an image is not published */
function usedPaths(){ var s=JSON.stringify(works)+JSON.stringify(play), out=[];
  Object.keys(pending).forEach(function(p){ if(pending[p].variant) return; if(s.indexOf('"'+p+'"')>=0){ out.push(p);
    if(/-r\.webp$/.test(p)){ var b=p.replace(/\.webp$/,""); [b+"-1280.webp",b+"-640.webp"].forEach(function(v){ if(pending[v]) out.push(v); }); } } });
  return out; }
function publish(){
  var paths=usedPaths(), btn=document.getElementById("pub"); btn.disabled=true;
  var head,baseTree;
  toast("Đang đăng…",60000);
  return gh("/git/ref/heads/"+REPO.branch).then(function(r){ head=r.object.sha; return gh("/git/commits/"+head); })
  .then(function(c){ baseTree=c.tree.sha;
    return paths.reduce(function(p,path){ return p.then(function(acc){
      return blobToB64(pending[path].blob).then(function(b64){ return gh("/git/blobs",{method:"POST",body:{content:b64,encoding:"base64"}}); })
        .then(function(b){ acc.push({path:path,mode:"100644",type:"blob",sha:b.sha}); return acc; });
    }); },Promise.resolve([]));
  }).then(function(tree){
    return gh("/git/blobs",{method:"POST",body:{content:textToB64(serialize()),encoding:"base64"}})
      .then(function(b){ tree.push({path:DATA_PATH,mode:"100644",type:"blob",sha:b.sha});
        if(!playOk) return tree;
        return gh("/git/blobs",{method:"POST",body:{content:textToB64(serializePlay()),encoding:"base64"}}).then(function(b2){ tree.push({path:PLAY_PATH,mode:"100644",type:"blob",sha:b2.sha}); return tree; }); })
      .then(function(tr){ return gh("/git/trees",{method:"POST",body:{base_tree:baseTree,tree:tr}}); });
  }).then(function(t){ return gh("/git/commits",{method:"POST",body:{message:"Update works & playground via builder",tree:t.sha,parents:[head]}}); })
  .then(function(c){ return gh("/git/refs/heads/"+REPO.branch,{method:"PATCH",body:{sha:c.sha}}); })
  .then(function(){ paths.forEach(function(p){ pending[p].published=true; }); dirty=false; renderHeader(); toast("Đã đăng. Site cập nhật sau khoảng 1 phút.",5000); })
  .catch(function(e){ toast("Không đăng được: "+e.message,6000); })
  .finally(function(){ btn.disabled=false; });
}

/* ======== Media ======== */
/* Every image is saved in 3 sizes: name-r.webp (≤1920), name-r-1280.webp, name-r-640.webp — the site picks the right one */
function encode(bm,maxW,q){
  var s=Math.min(1,maxW/Math.max(bm.width,bm.height)), c=document.createElement("canvas");
  c.width=Math.round(bm.width*s); c.height=Math.round(bm.height*s); c.getContext("2d").drawImage(bm,0,0,c.width,c.height);
  return new Promise(function(res){ c.toBlob(res,"image/webp",q==null?IMG_Q:q); });
}
/* opts: {q, maxW} quality / max size for all 3 variants; {auto:true} picks the suggested quality; {keep:true} remembers the source so the picture can be re-tuned */
function makeVariants(bm,path,fullBlob,opts){
  opts=opts||{}; var maxW=opts.maxW||MAX_IMG, q=opts.q;
  var first=fullBlob?Promise.resolve(fullBlob):encode(bm,maxW,opts.auto?SUGGEST_Q:q);
  return first.then(function(b0){
    if(opts.auto&&b0.size>HEAVY_BYTES){ q=SUGGEST_Q_HEAVY; return encode(bm,maxW,q); }
    if(opts.auto) q=SUGGEST_Q;
    return b0;
  }).then(function(b0){
    return Promise.all([encode(bm,Math.min(1280,maxW),q),encode(bm,Math.min(640,maxW),q)]).then(function(r){ return [b0,r[0],r[1]]; });
  }).then(function(bl){
    if(bl[0].size>MAX_FILE) throw new Error("Ảnh sau khi nén vẫn lớn hơn 25MB.");
    var b=path.replace(/\.webp$/,""), old=pending[path]||{};
    [path,b+"-1280.webp",b+"-640.webp"].forEach(function(k){ if(pending[k]) URL.revokeObjectURL(pending[k].url); });
    var meta=opts.keep?{bm:bm,q:q==null?IMG_Q:q,maxW:maxW,orig:opts.orig||old.orig||0}:{};
    pending[path]=Object.assign({blob:bl[0],url:URL.createObjectURL(bl[0]),kind:"image"},meta);
    pending[b+"-1280.webp"]={blob:bl[1],url:URL.createObjectURL(bl[1]),kind:"image",variant:true};
    pending[b+"-640.webp"]={blob:bl[2],url:URL.createObjectURL(bl[2]),kind:"image",variant:true};
    return path;
  });
}
function processFile(file,base,dir){
  if(file.size>MAX_FILE&&!/^image\//.test(file.type)) return Promise.reject(new Error("File lớn hơn 25MB. Hãy nén video, hoặc đưa lên R2 rồi dán link."));
  var stamp=Date.now().toString(36);
  if(/^video\//.test(file.type)){
    var ext=(file.name.split(".").pop()||"mp4").toLowerCase(), path=(dir||MEDIA_DIR)+base+"-"+stamp+"."+ext;
    pending[path]={blob:file,url:URL.createObjectURL(file),kind:"video"}; return Promise.resolve(path);
  }
  if(!/^image\//.test(file.type)) return Promise.reject(new Error("Chỉ nhận ảnh hoặc video."));
  return createImageBitmap(file).then(function(bm){ return makeVariants(bm,(dir||MEDIA_DIR)+base+"-"+stamp+"-r.webp",null,{auto:true,keep:true,orig:file.size}); });
}
/* ======== Per-image quality dialog (click an image you uploaded this session) ======== */
function fmtKB(n){ return n>=1048576?(n/1048576).toFixed(2)+" MB":Math.round(n/1024)+" KB"; }
function openQuality(path,done){
  var P=pending[path]; if(!P||!P.bm) return;
  var q=Math.round(P.q*100), maxW=P.maxW, timer=null, seq=0, cur=null;
  var img=h("img",{alt:""}), sizeEl=h("div",{class:"qsize"}), qv=h("b",{},[q+"%"]);
  var slider=h("input",{type:"range",min:40,max:95,step:1,value:q});
  var sel2=h("select",{},[h("option",{value:1920},["Tối đa 1920px"]),h("option",{value:1280},["Tối đa 1280px"])]); sel2.value=String(maxW);
  var ok=h("button",{},["Dùng mức này"]), cancel=h("button",{class:"ghost"},["Huỷ"]);
  var bd=h("div",{class:"qback"},[h("div",{class:"qbox"},[
    h("div",{class:"qprev"},[img]),
    h("label",{},["Chất lượng WebP ",qv,slider]), h("label",{},["Kích thước",sel2]),
    sizeEl, h("div",{class:"meta"},["Gợi ý: 78% (70% nếu ảnh nhiều grain). Dưới 60% có thể thấy vỡ hạt."]),
    h("div",{class:"row"},[ok,cancel])])]);
  function close(){ clearTimeout(timer); if(cur) URL.revokeObjectURL(cur); bd.remove(); }
  function est(){ var my=++seq; sizeEl.textContent="Đang tính…";
    encode(P.bm,+sel2.value,q/100).then(function(b){ if(my!==seq) return;
      if(cur) URL.revokeObjectURL(cur); cur=URL.createObjectURL(b); img.src=cur;
      sizeEl.textContent="WebP "+q+"%: "+fmtKB(b.size)+(P.orig?"  ·  file gốc: "+fmtKB(P.orig):"")+(b.size>HEAVY_BYTES?"  — hơi nặng":""); }); }
  slider.addEventListener("input",function(){ q=+slider.value; qv.textContent=q+"%"; clearTimeout(timer); timer=setTimeout(est,150); });
  sel2.addEventListener("change",est);
  cancel.addEventListener("click",close);
  bd.addEventListener("click",function(e){ if(e.target===bd) close(); });
  ok.addEventListener("click",function(){ ok.disabled=true; toast("Đang nén…",60000);
    makeVariants(P.bm,path,null,{q:q/100,maxW:+sel2.value,keep:true,orig:P.orig}).then(function(){ close(); mark(); toast("Đã áp dụng "+q+"%."); if(done) done(); })
      .catch(function(e){ ok.disabled=false; toast(e.message,5000); }); });
  document.body.appendChild(bd); est();
}
/* A media picker bound to obj[key]. imagesOnly for covers. */
function mediaSlot(obj,key,opts){
  opts=opts||{};
  var th=h("div",{class:"thumb"+(opts.wide||opts.stack?" big":"")}), path=h("div",{class:"path"}), url=h("input",{placeholder:"…hoặc dán link https (R2, CDN)"});
  var meta=h("div",{class:"meta"}), qinfo=h("div",{class:"meta"});
  function check(w,hh){
    if(!w||!hh){ meta.textContent=""; return; }
    var msg=w+"×"+hh+" · "+ratioText(w,hh), warn=false;
    if(opts.ratio&&Math.abs((w/hh)/opts.ratio-1)>.04){ msg+=" — khác tỉ lệ ô ("+opts.ratioLabel+"), sẽ bị cắt bớt"; warn=true; }
    else if(!opts.quiet&&w<1000&&!isVideo(obj[key])){ msg+=" — ảnh hơi nhỏ, có thể mờ trên màn lớn"; warn=true; }
    meta.textContent=msg; meta.className="meta"+(warn?" warn":"");
  }
  function paint(){ var p=obj[key]; th.innerHTML=""; path.textContent=p||"Chưa có"; meta.textContent="";
    var P=p&&pending[p]; qinfo.textContent=P&&P.bm?"WebP "+Math.round(P.q*100)+"% · "+fmtKB(P.blob.size)+" — bấm vào ảnh để chỉnh chất lượng":"";
    th.style.cursor=P&&P.bm?"pointer":""; th.title=P&&P.bm?"Chỉnh chất lượng":"";
    if(p){ var el=isVideo(p)?h("video",{src:src(p),muted:true,loop:true,autoplay:true,playsinline:true}):h("img",{src:src(p),alt:""});
      if(opts.ratio) th.style.aspectRatio=String(opts.ratio);
      el.addEventListener(isVideo(p)?"loadedmetadata":"load",function(){ check(el.videoWidth||el.naturalWidth,el.videoHeight||el.naturalHeight); });
      th.appendChild(el); }
    else if(opts.ratio) th.style.aspectRatio=String(opts.ratio);
    url.value=/^https?:/.test(p||"")?p:""; }
  var file=h("input",{type:"file",accept:opts.imagesOnly?"image/*":"image/*,video/mp4,video/webm,video/quicktime",style:"display:none",on:{change:function(){
    var f=file.files[0]; if(!f) return; toast("Đang xử lý…",60000);

  var map={}; Object.keys(pending).forEach(function(p){ map[p]=pending[p].url; });

  try{ localStorage.setItem("way-preview",JSON.stringify({works:clean,play:shots,map:map,t:Date.now()})); }catch(e){ toast("Dữ liệu quá lớn để xem trước."); return; }
  window.open("../?preview=1","way-preview");
}

/* ======== Start ======== */
function start(){
  app.innerHTML='<p class="login mut">Đang tải dữ liệu…</p>';
  load().then(renderApp).catch(function(e){ renderLogin(e.message); });
}
window.addEventListener("beforeunload",function(e){ if(dirty){ e.preventDefault(); e.returnValue=""; } });
if(token) start(); else renderLogin();
})();
</script>
